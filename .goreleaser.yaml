version: 2

project_name: ajaxbridge

before:
  hooks:
    - go test ./bridge/...
    - npm --prefix ./ha-cards run build
    - npm --prefix ./ha-cards run check

builds:
  - id: ajaxbridge
    main: ./bridge/cmd/ajaxbridge
    binary: ajaxbridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

checksum:
  disable: true

docker_digest:
  name_template: digests.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

changelog:
  use: git
  sort: asc

dockers_v2:
  - id: ajaxbridge
    ids:
      - ajaxbridge
    dockerfile: bridge/Dockerfile.goreleaser
    images:
      - rcooler/ajax2prometheus
      - rcooler/ajax-bridge
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Ajax security hub SIA DC-09 to Prometheus exporter"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    platforms:
      - linux/amd64
      - linux/arm64

release:
  skip_upload: true
