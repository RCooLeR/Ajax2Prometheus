name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated and runtime files stay untracked
        run: |
          tracked="$(git ls-files 'bridge/data/*' 'ha-cards/dist/*' '.idea/*')"
          if [ -n "$tracked" ]; then
            printf 'Generated/runtime files must not be tracked:\n%s\n' "$tracked"
            exit 1
          fi

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache: true
          cache-dependency-path: bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  ha-cards:
    name: ha-cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Install dependencies
        run: npm --prefix ./ha-cards ci

      - name: Typecheck
        run: npm --prefix ./ha-cards run check

      - name: Build
        run: npm --prefix ./ha-cards run build
