# Paste this entire file into Home Assistant "Add card -> Manual".
# Entity IDs here follow Home Assistant's usual slug pattern based on device names.
type: vertical-stack
cards:
  - type: markdown
    content: |
      # Будинок
  - type: grid
    columns: 5
    square: false
