            name: Power
          - entity: binary_sensor.rele_vorit_connection_lost
            name: Connectivity
          - entity: binary_sensor.rele_vorit_hardware_fault
            name: Hardware
          - entity: binary_sensor.rele_vorit_firmware
            name: Firmware
          - entity: sensor.rele_vorit_last_event
            name: Last event
          - entity: sensor.rele_vorit_last_signal
            name: Last signal
          - entity: sensor.rele_vorit_last_event_time
            name: Last update
