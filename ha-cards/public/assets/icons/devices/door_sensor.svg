<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="door_sensor">
  <defs>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
<g filter="url(#glow)" stroke="#3b82f6" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <style>
      .line { stroke: #3b82f6; fill: none; }
      .muted { opacity: .28; }
      .fill { fill: #3b82f6; stroke: none; }
      .mini { fill: #3b82f6; stroke: none; font: 700 26px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <rect class="line" x="88" y="62" width="82" height="148" rx="6"/>
<circle class="fill" cx="150" cy="136" r="4"/>
  </g>
</svg>