<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="rooms">
  <defs>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
<g filter="url(#glow)" stroke="#94a3b8" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <style>
      .line { stroke: #94a3b8; fill: none; }
      .muted { opacity: .28; }
      .fill { fill: #94a3b8; stroke: none; }
      .mini { fill: #94a3b8; stroke: none; font: 700 26px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <rect class="line" x="62" y="62" width="52" height="52" rx="10"/>
<rect class="line" x="142" y="62" width="52" height="52" rx="10"/>
<rect class="line" x="62" y="142" width="52" height="52" rx="10"/>
<rect class="line" x="142" y="142" width="52" height="52" rx="10"/>
  </g>
</svg>