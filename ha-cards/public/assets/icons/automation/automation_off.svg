<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="automation_off">
  <defs>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
<g filter="url(#glow)" stroke="#a855f7" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <style>
      .line { stroke: #a855f7; fill: none; }
      .muted { opacity: .28; }
      .fill { fill: #a855f7; stroke: none; }
      .mini { fill: #a855f7; stroke: none; font: 700 26px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <rect class="line" x="54" y="94" width="148" height="68" rx="34"/>
<circle class="line" cx="90" cy="128" r="24"/>
  </g>
</svg>